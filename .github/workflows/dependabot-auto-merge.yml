name: 'Dependabot Auto-Merge'

# Arms auto-merge on Dependabot pull requests under the policy of core record 0023
# (decisions/core/0023-dependency-updates-arrive-late-and-only-tooling-merges-without-a-person.md).
# GitHub merges once the required status checks pass and the branch-protection
# ruleset is satisfied - this workflow only arms the merge.
#
# The decision is made by scripts/dependabot-auto-merge.mjs (tested in
# src/dependabotAutoMerge.unit.test.ts). A pull request is armed only when
# - all its commits are by Dependabot and its commit message carries the Dependabot
#   metadata (no metadata, no arming);
# - every update is in the Dependabot group `tooling` of dependabot.yml (the named list
#   of packages that do not end up in what we ship). A bundled package, a GitHub Action
#   and a package that is listed nowhere come as a pull request of their own, which a
#   person merges, security updates of such packages included;
# - every update is a patch or a minor update;
# - no updated package belongs to the manual set: a package name with a segment
#   `prettier`, `typescript` or `eslint` (Prettier, TypeScript, ESLint, and their plugins,
#   configs and typings, for example eslint-plugin-import-x or @typescript-eslint/parser),
#   which a person updates (Prettier minors reformat code, the TypeScript and ESLint
#   majors need coordinated config work);
# - every package version that the pull request adds or changes in package-lock.json,
#   direct or transitive, was published at least 7 days ago (npm registry). Dependabot's
#   cooldown (dependabot.yml) delays the proposal of a direct update; this test also
#   covers what a bump pulls into the lockfile. If the registry cannot be read, the pull
#   request is not armed.
# A pull request that only fails the age test is looked at again by the daily sweep.
#
# Major updates are never armed. GitHub Actions updates (label `github_actions`) are never
# armed either, whatever the update type: a person merges them. Dependabot "rules" in repo
# settings only triage alerts - they cannot auto-merge PRs. That is why this workflow exists.
#
# The script is taken from the default branch, not from the pull request, and the token
# is handed only to the step that runs it.

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Guard on the actor for pull requests: skips immediately for every non-Dependabot PR,
    # including all human PRs. The daily sweep and a manual run look at the open
    # Dependabot pull requests only.
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    steps:
      - name: Check out the script of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Arm auto-merge where the policy allows it
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/dependabot-auto-merge.mjs --repo "$REPO" --pr "$PR_NUMBER"
          else
            node scripts/dependabot-auto-merge.mjs --repo "$REPO" --sweep
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
