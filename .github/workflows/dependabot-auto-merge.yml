name: 'Dependabot Auto-Merge'

# Arms auto-merge on Dependabot pull requests under the policy of core record 0023
# (https://github.com/rockcarver/frodo-lib/blob/main/decisions/core/0023-dependency-updates-arrive-late-and-only-tooling-merges-without-a-person.md).
# GitHub merges once the required status checks pass and the branch-protection
# ruleset is satisfied - this workflow only arms the merge.
#
# The policy is implemented by one action that frodo-lib and frodo-cli share:
# https://github.com/gearsnlevers/dependabot-auto-merge-action (its README says what
# it checks, in plain words). This workflow only decides when to call it and with
# which token. The action arms a pull request only when
# - all its commits are by Dependabot and its commit message carries the Dependabot
#   metadata (no metadata, no arming);
# - every update is in the Dependabot group `tooling` of dependabot.yml (the named list
#   of packages that do not end up in what we ship; a security update has no group, so
#   its package is matched against the same list). A bundled package, a GitHub Action
#   and a package that is listed nowhere come as a pull request of their own, which a
#   person merges;
# - every update is a patch or a minor update;
# - no updated package belongs to the manual set: a package name with a segment
#   `prettier`, `typescript` or `eslint` (Prettier, TypeScript, ESLint, and their plugins,
#   configs and typings, for example eslint-plugin-import-x or @typescript-eslint/parser),
#   which a person updates (Prettier minors reformat code, the TypeScript and ESLint
#   majors need coordinated config work);
# - every package version that the pull request adds or changes in package-lock.json,
#   direct or transitive, was published at least 7 days ago (npm registry). Dependabot's
#   cooldown (dependabot.yml) delays the proposal of a direct update; this test also
#   covers what a bump pulls into the lockfile. If the registry cannot be read, the pull
#   request is not armed.
# A pull request that only fails the age test is looked at again by the daily sweep.
#
# Major updates are never armed. GitHub Actions updates (label `github_actions`) are never
# armed either, whatever the update type: a person merges them. Dependabot "rules" in repo
# settings only triage alerts - they cannot auto-merge PRs. That is why this workflow exists.
#
# The action is pinned by its full commit SHA, so what runs here is what a person read: a
# new version arrives as a Dependabot pull request for GitHub Actions, which a person
# merges after reading what changed. The action reads the policy (the tooling list) from
# dependabot.yml on the default branch through the API, never from the pull request, and
# this workflow checks out nothing. The token is handed only to the step that runs the
# action. The job does not run for the pull requests that move the pin themselves
# (branches dependabot/github_actions/...): they are never armed, and the new, unread
# version of the action must not run with this token before a person has read it; the
# daily sweep, which runs this file from the default branch, looks at them.
#
# First run after a change of the pin: start the workflow by hand with `dry-run` set to
# true; it decides and reports and arms nothing.

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'true to decide and report, but arm nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Guard on the actor for pull requests: skips immediately for every non-Dependabot PR,
    # including all human PRs, and for the pull requests of Dependabot that update a GitHub
    # Action (see above). The daily sweep and a manual run look at the open Dependabot
    # pull requests only.
    if: github.event_name != 'pull_request' || (github.actor == 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/github_actions/'))
    steps:
      - name: Arm auto-merge where the policy allows it
        uses: gearsnlevers/dependabot-auto-merge-action@45357b7f4a66638b9dd485dab564c0005c30f4b5 # v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request: ${{ github.event.pull_request.number }}
          dry-run: ${{ inputs.dry-run || 'false' }}
