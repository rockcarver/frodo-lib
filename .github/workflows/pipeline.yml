name: 'Frodo Library Release Pipeline'

on:
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/CONTRIBUTE.md'
      - '**/PIPELINE.md'
      - '**/README.md'
      - 'docs/**'
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/CONTRIBUTE.md'
      - '**/PIPELINE.md'
      - '**/README.md'
      - '**/pipeline.yml'
      - '**/doc.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | patch | minor | major'
        type: choice
        options:
          - prerelease
          - patch
          - minor
          - major
        default: 'prerelease'
        required: true
      dry-run:
        description: 'Test release pipeline without publishing, tagging, or creating GitHub releases'
        type: boolean
        default: false
        required: true

env:
  NODE_VERSION: 24

permissions:
  contents: write
  pull-requests: read
  id-token: write
      
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rockcarver'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 'Prepare Version Bump'
        id: version-bump
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: vscheuber/version-bump-action@v1
        with:
          release-type: ${{ github.event.inputs.release-type }}

      - name: Update package manifests for release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: vscheuber/manifest-version-update-action@v1
        with:
          version: ${{ steps.version-bump.outputs.newVersion }}

      - name: Build library
        run: npm run build

      - name: Build docs
        run: |
          npm run doc

      - name: Lint
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level critical

      - name: Zip build artifacts
        run: zip -r build.zip dist mocks package.json package-lock.json snapshotResolve.js types docs

      - uses: actions/upload-artifact@v6
        with:
          name: build
          path: |
            build.zip

    outputs:
      newTag: ${{ steps.version-bump.outputs.newTag || '' }}
      newVersion: ${{ steps.version-bump.outputs.newVersion || '' }}
      preRelease: ${{ steps.version-bump.outputs.preRelease || '' }}
      actionReleaseType: ${{ steps.version-bump.outputs.action_release_type || '' }}

  test:
    name: 'Test'
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        node-version: [26, 24, 22]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Service containers to run with `test`
    services:
      # Label used to access the service container
      squid:
        # Docker Hub image
        image: ubuntu/squid
        #
        ports:
          # Maps tcp port 3128 on the host to the same port in the service container
          - 3128:3128

    steps:
      # Need to check out repo to get .snap and .har files for unit tests
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/download-artifact@v7
        with:
          name: build

      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      #
      # Run tests.
      #
      - name: Direct Tests
        id: direct-tests
        env:
          FRODO_DEBUG: ${{ vars.FRODO_DEBUG }}
          FRODO_HOST: ${{ vars.FIDC_TENANT_URL }}
          # FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          # FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          npm run test
        continue-on-error: true # Allow subsequent steps to run even if tests fail

      - name: Show debug log on failure
        if: steps.direct-tests.outcome == 'failure'
        run: |
          cat frodo-lib-debug.log

      - name: Show jest exceptions log on failure
        if: steps.direct-tests.outcome == 'failure'
        run: |
          cat frodo-lib-jest-exceptions.log

      - name: Proxy Tests
        id: proxy-tests
        env:
          FRODO_DEBUG: ${{ vars.FRODO_DEBUG }}
          HTTPS_PROXY: 'http://127.0.0.1:3128'
          FRODO_HOST: ${{ vars.FIDC_TENANT_URL }}
          # FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          # FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          npm run test

      - name: Show debug log on failure
        if: steps.proxy-tests.outcome == 'failure'
        run: |
          cat frodo-lib-debug.log

      - name: Show jest exceptions log on failure
        if: steps.proxy-tests.outcome == 'failure'
        run: |
          cat frodo-lib-jest-exceptions.log

      - name: Security Audit
        run: |
          npm audit --omit=dev --audit-level high

  npm-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build

      - name: Unzip build artifact
        run: unzip build.zip

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        id: npm-publish
        uses: vscheuber/npm-trusted-publish-action@v1
        with:
          release-type: ${{ github.event.inputs.release-type }}
          package-name: '@rockcarver/frodo-lib'
          version: ${{ needs.build.outputs.newVersion }}
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}

      - name: Publish summary
        run: |
          echo "published=${{ steps.npm-publish.outputs.published }}"
          echo "tag=${{ steps.npm-publish.outputs.tag }}"
          echo "is-prerelease=${{ steps.npm-publish.outputs.is-prerelease }}"

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, npm-release]
    name: 'Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: build

      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip

      - name: 'Github SHA'
        id: github-sha
        run: echo ${{ github.sha }} > Release.txt

      - name: Generate and promote AI changelog
        id: changelog
        uses: vscheuber/ai-changelog-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          changelog-path: CHANGELOG.md
          since: last-release
          target-user-type: developer
          release-type: ${{ needs.build.outputs.actionReleaseType || github.event.inputs.release-type }}
          version: ${{ needs.build.outputs.newVersion }}
          promote-release: true
          release-tag: ${{ needs.build.outputs.newTag }}
          release-notes-path: RELEASE_NOTES.md
          commit: false

      - name: Commit updated changelog, version, and docs
        id: commit-changelog
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json docs
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            git commit --message "Updated changelog, version, and docs for release ${{ needs.build.outputs.newTag }}"
            git push origin HEAD
          fi

      - name: Create and push tag
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git fetch --tags
          tag='${{ needs.build.outputs.newTag }}'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "${tag}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$existing_commit" == "$current_commit" ]]; then
              echo "Tag ${tag} already exists on the current commit; skipping"
              exit 0
            fi

            echo "Tag ${tag} already exists on a different commit"
            exit 1
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          name: Frodo Library ${{ needs.build.outputs.newVersion }}
          tag_name: ${{ needs.build.outputs.newTag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ needs.build.outputs.preRelease }}
          generate_release_notes: ${{ contains(needs.build.outputs.newTag, '-') }}
          files: |
            CHANGELOG.md
            LICENSE
            Release.txt
          token: ${{ secrets.GITHUB_TOKEN }}

  doc:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry-run
    needs: [build, release]
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: build
      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload docs directory
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
