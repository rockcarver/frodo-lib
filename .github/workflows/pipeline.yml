name: 'Frodo Library Release Pipeline'

on:
  pull_request:
    branches:
      - 'main'
    # No paths-ignore here: with required status checks on main, a PR whose
    # changes skip CI entirely could never merge (its required checks would
    # stay "expected" forever). The push trigger keeps paths-ignore so
    # docs-only pushes to main stay cheap.
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/CODE_OF_CONDUCT.md'
      - '**/CONTRIBUTE.md'
      - '**/PIPELINE.md'
      - '**/README.md'
      - '**/pipeline.yml'
      - '**/doc.yml'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release kind: prerelease | premajor | patch | minor | major'
        type: choice
        options:
          - prerelease
          - premajor
          - patch
          - minor
          - major
        default: 'prerelease'
        required: true
      dry-run:
        description: 'Test release pipeline without publishing, tagging, or creating GitHub releases'
        type: boolean
        default: false
        required: true

env:
  NODE_VERSION: 24

permissions:
  contents: write
  pull-requests: read
  id-token: write
      
jobs:
  # Classifies a PR so the long test jobs can be skipped for changes that touch
  # no code, and decides whether the fast guidance job has to run. This cannot
  # be done with `paths-ignore` on the pull_request trigger: the required
  # checks would stay "expected" forever. Skipped jobs count as passing for
  # required checks. The rules live in .github/scripts/classify-changes.sh
  # (records 0012 and 0016 of rockcarver/frodo, PIPELINE.md).
  # Fails safe: anything not on the allowlist, any API error, a missing
  # classifier and every non-PR event (push, workflow_dispatch, releases) is
  # treated as code.
  changes:
    name: 'Detect code changes'
    runs-on: ubuntu-latest
    # Only reads the file list of the pull request and one script.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      guidance: ${{ steps.classify.outputs.guidance }}
    steps:
      # The classifier comes from the commit the PR targets, never from the PR:
      # a PR that edits it is classified by the trusted version, and the script
      # itself counts as code. While the script does not exist on the base
      # commit (the PR that adds it) the step below finds none and the run
      # counts as code.
      - name: Check out the classifier
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts/classify-changes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          result=$'code=true\nguidance=false'
          if [ "${EVENT}" = "pull_request" ] \
              && files=$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
                --jq '.[] | .filename, (.previous_filename // empty)') \
              && out=$(printf '%s\n' "${files}" | bash .github/scripts/classify-changes.sh); then
            result="${out}"
          fi
          echo "${result}"
          echo "${result}" >> "$GITHUB_OUTPUT"

  # Runs the tests that validate files the code filter treats as non-code:
  # decision records, skills, the agent entry points and the other root
  # Markdown. It runs whenever such a file changes (the classifier decides),
  # also when the long test matrix is skipped, so that an invalid record or
  # skill still blocks the merge. A code change runs the same tests again in
  # the full suite; this job only gives the answer sooner. `Test gate` waits
  # for it. Which tests: PIPELINE.md, "Validate guidance".
  guidance:
    name: 'Validate guidance'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.guidance == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # These tests run on the sources and need no build (AGENTS.md).
      - name: Validate decision records, skills and policy files
        run: |
          npm run test:only -- --runTestsByPath \
            src/agentSkills.test.ts \
            src/decisionRecords.test.ts \
            src/index.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rockcarver'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 'Prepare Version Bump'
        id: version-bump
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: gearsnlevers/version-bump-action@v1
        with:
          release-type: ${{ github.event.inputs.release-type }}

      - name: Release preflight checks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: gearsnlevers/release-preflight-action@v1
        with:
          candidate-version: ${{ steps.version-bump.outputs.newVersion }}
          candidate-tag: ${{ steps.version-bump.outputs.newTag }}
          package-name: '@rockcarver/frodo-lib'
          current-version: ${{ steps.version-bump.outputs.base }}
          check-remote-tag: true
          check-npm-version: true
          check-version-drift: true

      - name: Show resolved release base
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "base=${{ steps.version-bump.outputs.base }}"
          echo "base_source=${{ steps.version-bump.outputs.base_source }}"
          echo "base_ref=${{ steps.version-bump.outputs.base_ref }}"
          echo "newVersion=${{ steps.version-bump.outputs.newVersion }}"
          echo "newTag=${{ steps.version-bump.outputs.newTag }}"

      - name: Update package manifests for release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: gearsnlevers/manifest-version-update-action@v1
        with:
          version: ${{ steps.version-bump.outputs.newVersion }}

      - name: Build library
        run: npm run build

      - name: Build docs
        run: |
          npm run doc

      - name: Lint
        run: npm run check

      # Check only. `npm audit fix` here rewrote package-lock.json inside the
      # build, the artifact carried that lockfile, and the Release job committed
      # it to main: the locked version of a dependency moved up and down from
      # release to release (and the alerts of Dependabot with it), and what was
      # built before this step differed from what was built after it. A
      # critical advisory fails the build; fixing it is a dependency pull
      # request.
      - name: Security Audit
        run: npm audit --audit-level critical

      - name: Zip build artifacts
        # scripts/patch-axios-types.cjs must ride along: package.json's
        # postinstall (added with the tsdown migration) needs it during the
        # artifact-only npm ci in the release jobs.
        run: zip -r build.zip dist mocks package.json package-lock.json snapshotResolve.js types docs scripts/patch-axios-types.cjs

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            build.zip

    outputs:
      newTag: ${{ steps.version-bump.outputs.newTag || '' }}
      newVersion: ${{ steps.version-bump.outputs.newVersion || '' }}
      preRelease: ${{ steps.version-bump.outputs.preRelease || '' }}
      actionReleaseType: ${{ steps.version-bump.outputs.action_release_type || '' }}

  test:
    name: 'Test'
    # You must use a Linux environment when using service containers or container jobs
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        node-version: [26, 24, 22]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Service containers to run with `test`
    services:
      # Label used to access the service container
      squid:
        # Docker Hub image
        image: ubuntu/squid
        #
        ports:
          # Maps tcp port 3128 on the host to the same port in the service container
          - 3128:3128

    steps:
      # Need to check out repo to get .snap and .har files for unit tests
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/download-artifact@v8
        with:
          name: build

      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      #
      # Run tests.
      #
      - name: Direct Tests
        id: direct-tests
        env:
          FRODO_DEBUG: ${{ vars.FRODO_DEBUG }}
          FRODO_HOST: ${{ vars.FIDC_TENANT_URL }}
          # FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          # FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          npm run test
        continue-on-error: true # Allow subsequent steps to run even if tests fail

      - name: Show jest exceptions log on failure
        if: steps.direct-tests.outcome == 'failure'
        run: |
          cat frodo-lib-jest-exceptions.log

      - name: Proxy Tests
        id: proxy-tests
        env:
          FRODO_DEBUG: ${{ vars.FRODO_DEBUG }}
          HTTPS_PROXY: 'http://127.0.0.1:3128'
          FRODO_HOST: ${{ vars.FIDC_TENANT_URL }}
          # FRODO_SA_ID: ${{ vars.FIDC_TENANT_SA_ID }}
          # FRODO_SA_JWK: ${{ secrets.FIDC_TENANT_SA_JWK }}
        run: |
          npm run test

      - name: Show jest exceptions log on failure
        if: steps.proxy-tests.outcome == 'failure'
        run: |
          cat frodo-lib-jest-exceptions.log

      - name: Security Audit
        run: |
          npm audit --omit=dev --audit-level high

  # Single stable-named gate over the versioned test matrix. Required status
  # checks on main point at THIS job, so changing the matrix's Node versions
  # never touches repo settings. It fails if any matrix leg fails or is
  # cancelled/skipped unexpectedly.
  test-gate:
    name: 'Test gate'
    needs: [build, changes, test, guidance]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test matrix leg or the guidance job did not succeed
        run: |
          build='${{ needs.build.result }}'
          changes='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          guidance_wanted='${{ needs.changes.outputs.guidance }}'
          result='${{ needs.test.result }}'
          guidance='${{ needs.guidance.result }}'
          echo "build=${build} changes=${changes} code=${code} test=${result} guidance_wanted=${guidance_wanted} guidance=${guidance}"
          if [ "${changes}" != "success" ]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi
          # The guidance job runs exactly when the classifier asked for it, and
          # then it must succeed: a skipped long matrix does not skip validation.
          if [ "${guidance_wanted}" = "true" ]; then
            expected_guidance=success
          else
            expected_guidance=skipped
          fi
          if [ "${guidance}" != "${expected_guidance}" ]; then
            echo "::error::Expected guidance result '${expected_guidance}', got '${guidance}'"
            exit 1
          fi
          if [ "${code}" = "true" ]; then
            expected=success
          else
            # Non-code PR: the tests are skipped on purpose, but Build must
            # still have passed (a skipped Build would also skip the tests).
            expected=skipped
            if [ "${build}" != "success" ]; then
              echo "::error::Build did not succeed"
              exit 1
            fi
          fi
          if [ "${result}" != "${expected}" ]; then
            echo "::error::Expected test result '${expected}', got '${result}'"
            exit 1
          fi

  test-cross-platform:
    name: 'Cross-Platform Tests (Credential File Permissions)'
    # Credential storage (master key, connection profiles, token cache) is
    # written with restricted permissions (0600/0700) to keep secrets from
    # being readable by other local users. That behavior depends on how
    # each OS's filesystem/Node fs layer handles file modes, so it's
    # verified directly on every OS frodo ships a binary for, independent
    # of the Linux-only `test` job above (which needs a Linux-only service
    # container and isn't testing this).
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The repo's Polly-recorded mock fixtures include very deeply nested
      # directory names (e.g. under src/test/mock-recordings/...) that
      # exceed Windows' default ~260-char MAX_PATH. Without this, git
      # itself fails to check them out ("Filename too long") before any
      # test code runs. core.longpaths makes git use the \\?\ long-path
      # prefix internally, which Windows has honored since XP -- no OS-level
      # opt-in (e.g. the LongPathsEnabled registry key) is required. Must
      # run before checkout, which does its own fresh `git init` and would
      # otherwise pick up the default (disabled) setting.
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Use PR head repo/ref for forked PRs; default to current repo/ref for push/workflow_dispatch.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Credential file permission tests
        shell: bash
        run: |
          NODE_OPTIONS=--experimental-vm-modules npx jest --silent \
            src/utils/ExportImportUtils.secureFile.test.ts \
            src/utils/ExportImportUtils.test.ts \
            src/utils/ExportImportUtils.writers.test.ts \
            src/utils/DataProtection.test.ts \
            src/ops/ConnectionProfileOps.test.ts \
            src/ops/ConnectionProfileOps.browserLogin.unit.test.ts \
            src/ops/ConnectionProfileOps.additionalServiceAccounts.unit.test.ts \
            src/ops/TokenCacheOps.browserToken.unit.test.ts \
            src/ops/TokenCacheOps.sessionManagement.unit.test.ts

  # Single, non-matrix job so branch protection has ONE stable check name to
  # require. GitHub matches required status-check contexts by exact name, and
  # matrix legs register as '<job name> (os)' -- so requiring the matrix job's
  # name directly never matches and leaves every PR permanently blocked from a
  # plain merge (admin bypass was the only way through). Mirrors the CLI's
  # `test-gate` job. Point the main-branch-protection ruleset at
  # 'Cross-Platform gate', not at the matrix job name.
  test-cross-platform-gate:
    name: 'Cross-Platform gate'
    needs: [build, changes, test-cross-platform]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any cross-platform matrix leg did not succeed
        run: |
          build='${{ needs.build.result }}'
          changes='${{ needs.changes.result }}'
          code='${{ needs.changes.outputs.code }}'
          result='${{ needs.test-cross-platform.result }}'
          echo "build=${build} changes=${changes} code=${code} test-cross-platform=${result}"
          if [ "${changes}" != "success" ]; then
            echo "::error::Change detection did not succeed"
            exit 1
          fi
          if [ "${code}" = "true" ]; then
            expected=success
          else
            # Non-code PR: the tests are skipped on purpose, but Build must
            # still have passed (a skipped Build would also skip the tests).
            expected=skipped
            if [ "${build}" != "success" ]; then
              echo "::error::Build did not succeed"
              exit 1
            fi
          fi
          if [ "${result}" != "${expected}" ]; then
            echo "::error::Expected test-cross-platform result '${expected}', got '${result}'"
            exit 1
          fi

  npm-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, test, test-cross-platform, test-cross-platform-gate]
    runs-on: ubuntu-latest
    steps:
      # The Release job commits the version and the changelog on top of the
      # commit this run was dispatched from and pushes that commit. When the
      # branch has moved since (a merge while the tests ran) the push is
      # rejected, but by then the package is on npm, which refuses to publish
      # a version twice, and the release is left without its version commit,
      # its tag and its GitHub release. Stop here, before anything is
      # published: dispatching again is then enough. This fails closed: a
      # branch that cannot be read blocks the release too.
      - name: Refuse to publish when the branch has moved
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_SHA: ${{ github.sha }}
          DISPATCHED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${DISPATCHED_REF#refs/}" --jq .object.sha)"
          if [ "${current}" != "${DISPATCHED_SHA}" ]; then
            echo "::error::${DISPATCHED_REF} is at ${current}, but this run was dispatched from ${DISPATCHED_SHA}. Nothing was published. Dispatch the release again when nothing is being merged."
            exit 1
          fi
          echo "${DISPATCHED_REF} is still at ${DISPATCHED_SHA}"

      - uses: actions/download-artifact@v8
        with:
          name: build

      - name: Unzip build artifact
        run: unzip build.zip

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Publish package
        id: npm-publish
        uses: gearsnlevers/npm-trusted-publish-action@v1
        with:
          release-type: ${{ github.event.inputs.release-type }}
          package-name: '@rockcarver/frodo-lib'
          version: ${{ needs.build.outputs.newVersion }}
          dual-release-on-stable: 'true'
          dry-run: ${{ inputs.dry-run && 'true' || 'false' }}

      - name: Publish summary
        run: |
          release_type='${{ github.event.inputs.release-type }}'
          stable_version='${{ needs.build.outputs.newVersion }}'
          publish_tag='${{ steps.npm-publish.outputs.tag }}'
          is_prerelease='${{ steps.npm-publish.outputs.is-prerelease }}'
          stable_published='${{ steps.npm-publish.outputs.stable_published }}'
          stable_already='${{ steps.npm-publish.outputs.stable_already_published }}'
          companion_published='${{ steps.npm-publish.outputs.companion_prerelease_published }}'
          companion_already='${{ steps.npm-publish.outputs.companion_prerelease_already_published }}'
          companion_version='${{ steps.npm-publish.outputs.companion_prerelease_version }}'

          echo "release_type=${release_type}"
          echo "stable_version=${stable_version}"
          echo "publish_tag=${publish_tag}"

          if [[ "$release_type" == 'prerelease' || "$is_prerelease" == 'true' ]]; then
            if [[ "$stable_published" == 'true' ]]; then
              echo "result=published prerelease to next"
            elif [[ '${{ steps.npm-publish.outputs.already_published }}' == 'true' ]]; then
              echo "result=prerelease already published, skipped"
            else
              echo "result=no publish performed"
            fi
          else
            echo "companion_prerelease_version=${companion_version}"
            if [[ "$companion_published" == 'true' ]]; then
              echo "companion_result=published ${companion_version} to next"
            elif [[ "$companion_already" == 'true' ]]; then
              echo "companion_result=already published (${companion_version})"
            else
              echo "companion_result=not attempted"
            fi

            if [[ "$stable_published" == 'true' ]]; then
              echo "stable_result=published ${stable_version} to ${publish_tag}"
            elif [[ "$stable_already" == 'true' ]]; then
              echo "stable_result=already published (${stable_version})"
            else
              echo "stable_result=not attempted"
            fi
          fi

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, npm-release]
    name: 'Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Push the release commit with the org-wide FRODO_CI_PAT instead of
          # GITHUB_TOKEN: the main-branch ruleset's required status checks
          # reject github-actions[bot] pushes (the Actions app cannot be a
          # bypass actor), while PAT-attributed pushes from a repository
          # admin are covered by the ruleset's bypass. See PIPELINE.md.
          token: ${{ secrets.FRODO_CI_PAT }}

      - uses: actions/download-artifact@v8
        with:
          name: build

      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip

      - name: 'Github SHA'
        id: github-sha
        run: echo ${{ github.sha }} > Release.txt

      - name: Generate and promote AI changelog
        id: changelog
        uses: gearsnlevers/ai-changelog-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          changelog-path: CHANGELOG.md
          since: last-release
          target-user-type: developer
          release-type: ${{ needs.build.outputs.actionReleaseType || github.event.inputs.release-type }}
          version: ${{ needs.build.outputs.newVersion }}
          promote-release: true
          release-tag: ${{ needs.build.outputs.newTag }}
          release-notes-path: RELEASE_NOTES.md
          commit: false

      - name: Commit updated changelog, version, and docs
        id: commit-changelog
        if: ${{ !inputs.dry-run }}
        env:
          FRODO_CI_PAT: ${{ secrets.FRODO_CI_PAT }}
        run: |
          set -euo pipefail
          # Refuse to run on an unauthenticated PAT (e.g. fork runs) instead
          # of silently pushing with GITHUB_TOKEN and tripping the ruleset.
          if [ -z "${FRODO_CI_PAT}" ]; then
            echo "::error::FRODO_CI_PAT secret is not set; cannot push the release commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json docs
          if git diff --cached --quiet; then
            echo "No release changes to commit"
          else
            # [skip ci]: this commit only bumps the version + changelog +
            # docs of a tree whose content was fully validated by THIS
            # release run; the push would otherwise re-trigger the
            # pipeline on main for a no-op validation. See PIPELINE.md.
            git commit --message "Updated changelog, version, and docs for release ${{ needs.build.outputs.newTag }} [skip ci]"
            git push origin HEAD
          fi

      - name: Create and push tag
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git fetch --tags
          tag='${{ needs.build.outputs.newTag }}'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing_commit="$(git rev-list -n 1 "${tag}")"
            current_commit="$(git rev-parse HEAD)"
            if [[ "$existing_commit" == "$current_commit" ]]; then
              echo "Tag ${tag} already exists on the current commit; skipping"
              exit 0
            fi

            echo "Tag ${tag} already exists on a different commit"
            exit 1
          fi
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          name: Frodo Library ${{ needs.build.outputs.newVersion }}
          tag_name: ${{ needs.build.outputs.newTag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          prerelease: ${{ needs.build.outputs.preRelease }}
          generate_release_notes: false
          files: |
            CHANGELOG.md
            LICENSE
            Release.txt
          token: ${{ secrets.RELEASE_TOKEN }}

  doc:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry-run
    needs: [build, release]
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build
      # need -o to overwrite package.json
      - name: Unzip build artifact
        run: unzip -o build.zip
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload docs directory
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
